<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ぽっと</title>
<meta name="theme-color" content="#111318">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ぽっと">
<style>
:root{
  --bg:#111318; --panel:#1a1d24; --panel2:#22262f; --line:#2e333d; --ink:#e9ebef; --dim:#8a919e; --faint:#5b6270;
  --due:#ffb347; --due2:#ff6b5e; --log:#6cc6ff; --ok:#6fdc9a; --accent:#ffd166;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif;-webkit-text-size-adjust:100%}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
.wrap{max-width:1400px;margin:0 auto;padding:10px 16px 40px}

/* 入力 */
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0 10px;margin:0 -16px;padding-left:16px;padding-right:16px;border-bottom:1px solid var(--line)}
.head{display:flex;align-items:center;gap:8px;margin-bottom:6px;color:var(--dim);font-size:12px}
.head b{color:var(--ink);font-size:15px;letter-spacing:.05em}
.head .sp{flex:1}
.dot{width:8px;height:8px;border-radius:50%;background:var(--faint);display:inline-block}
.dot.ok{background:var(--ok)} .dot.busy{background:var(--accent)} .dot.ng{background:var(--due2)}
#inp{width:100%;resize:none;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font:inherit;font-size:17px;line-height:1.4;outline:none;min-height:48px}
#inp:focus{border-color:#4a5262}
.pv{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-height:26px;margin-top:6px;font-size:13px;color:var(--dim)}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;background:var(--panel2);font-size:12.5px;color:var(--ink);white-space:nowrap}
.chip.k-due{background:rgba(255,179,71,.16);color:var(--due)} .chip.k-log{background:rgba(108,198,255,.14);color:var(--log)}
button.chip{border:1px dashed transparent} button.chip:hover{border-color:var(--faint)}
.hint{color:var(--faint);font-size:12px}

/* カレンダー：月・週・日を同時に。どれかで日を選ぶと3つとも合わせて動く */
.cal{display:grid;grid-template-columns:1.15fr 1.75fr 1fr;gap:10px;margin-top:14px}
.cp{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px;min-width:0}
.ch{display:flex;align-items:center;gap:6px;margin-bottom:8px;font-size:13px;font-weight:600}
.ch .tg{font-size:10px;letter-spacing:.1em;color:var(--dim);font-weight:600;background:var(--panel2);border-radius:6px;padding:2px 6px}
.ch .lbl{flex:1;text-align:center;white-space:nowrap}
.ch .nv{width:26px;height:26px;border-radius:8px;background:var(--panel2);flex:none;font-size:13px}
.ch .nv:hover{background:var(--line)}
.ch .td{font-size:11px;padding:4px 8px;border-radius:8px;background:var(--panel2);flex:none}
.mg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.mw{font-size:10px;color:var(--dim);text-align:center;padding-bottom:2px}
.sat{color:#6ea8ff} .sun{color:#ff7a7a}
.mc{min-height:62px;border-radius:6px;padding:2px 3px;cursor:pointer;background:var(--bg);min-width:0}
.mc:hover{background:var(--panel2)}
.mc.out{opacity:.35}
.mc.inweek{background:var(--panel2)}
.mc.sel{outline:2px solid var(--accent);outline-offset:-2px}
.mc .n{font-size:11px;display:inline-block;min-width:16px;text-align:center}
.mc.today .n{background:var(--accent);color:#111;border-radius:999px;font-weight:700}
.mi{font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.4}
.mi.due{color:var(--due)} .mi.log{color:var(--log)} .mi.done{text-decoration:line-through;opacity:.55} .mi.more{color:var(--faint)}
.mdots{display:none}
.wg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.wd{background:var(--bg);border-radius:8px;padding:4px;min-height:170px;cursor:pointer;min-width:0}
.wd:hover{background:#171a20}
.wd.sel{outline:2px solid var(--accent);outline-offset:-2px}
.wd .wh{font-size:11px;color:var(--dim);text-align:center;margin-bottom:5px;white-space:nowrap}
.wd.today .wh b{background:var(--accent);color:#111;border-radius:999px;padding:0 5px}
.ci{font-size:11px;border-radius:5px;padding:2px 5px;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.ci.due{background:rgba(255,179,71,.16);color:var(--due)} .ci.log{background:rgba(108,198,255,.14);color:var(--log)}
.ci.done{text-decoration:line-through;opacity:.55}
.ci.over{background:rgba(255,107,94,.18);color:var(--due2)}
.wd .ci{white-space:normal;word-break:break-all;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;line-height:1.3;padding:3px 4px}
.wd .ci small{display:block;font-size:9.5px;opacity:.85}
@media (min-width:761px) and (max-width:1180px){
  .cal{grid-template-columns:1.1fr 1fr;grid-template-areas:"m d" "w w"}
  .cp.cm{grid-area:m} .cp.cd{grid-area:d} .cp.cw{grid-area:w}
}
.dl .ci{font-size:13.5px;white-space:normal;padding:7px 9px;margin-bottom:6px;display:flex;gap:8px;align-items:baseline;color:var(--ink)}
.dl .ci .t{flex:none;font-variant-numeric:tabular-nums;min-width:42px;font-size:12px}
.dl .ci.due .t,.dl .ci.due .r{color:var(--due)} .dl .ci.log .t,.dl .ci.log .r{color:var(--log)} .dl .ci.over .t,.dl .ci.over .r{color:var(--due2)}
.dl .ci .r{margin-left:auto;flex:none;font-weight:700;font-size:12px}
.dl .ci .w{color:var(--accent);font-size:11.5px}
.dl .none{color:var(--faint);font-size:12.5px;padding:18px 6px;text-align:center}
@media (max-width:760px){
  .cal{grid-template-columns:1fr}
  .cp.cd{order:1} .cp.cw{order:2} .cp.cm{order:3}
  .wg{grid-template-columns:1fr;gap:3px}
  .wd{min-height:0;display:flex;gap:8px;align-items:flex-start;padding:6px}
  .wd .wh{width:52px;text-align:left;flex:none;margin:1px 0 0}
  .wd .wi{flex:1;min-width:0;display:flex;flex-wrap:wrap;gap:3px}
  .wd .ci{margin:0;max-width:100%}
  .wd .ci small{display:inline;margin-right:3px}
  .wd .ci{padding-right:22px}
  .wd .wi:empty::after{content:'—';color:var(--faint);font-size:11px}
  .mc{min-height:42px}
  .mi{display:none}
  .mdots{display:flex;gap:2px;flex-wrap:wrap;margin-top:2px;padding-left:2px}
  .mdots i{width:5px;height:5px;border-radius:50%;display:block}
}

.xx{flex:none;width:24px;height:24px;border-radius:50%;color:var(--faint);font-size:15px;line-height:24px;text-align:center;align-self:center}
.xx:hover{background:rgba(255,107,94,.18);color:var(--due2)}
.card .xx{align-self:flex-start;margin:-2px -4px 0 0}
.wd .ci{position:relative}
.wd .ci .xx{position:absolute;top:1px;right:1px;width:18px;height:18px;line-height:18px;font-size:12px;background:var(--panel);display:none}
.wd .ci:hover .xx{display:block}
@media (hover:none){ .wd .ci .xx{display:block} }

/* タブ */
.tabs{display:flex;gap:4px;margin-left:8px}
.tabs button{font-size:12.5px;padding:3px 10px;border-radius:999px;color:var(--dim);background:transparent;border:1px solid var(--line)}
.tabs button.on{background:var(--panel2);color:var(--ink);border-color:var(--faint)}
body.quick .tabs{display:none}
body[data-tab="tags"] .cal,body[data-tab="tags"] .strip,body[data-tab="tags"] .board{display:none}
body[data-tab="home"] #tagView,body.quick #tagView{display:none}

/* タグの印 */
.tchip{display:inline-flex;align-items:center;gap:2px;font-size:11px;padding:1px 7px;border-radius:999px;background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c);white-space:nowrap;line-height:1.5}
.tchips{display:inline-flex;flex-wrap:wrap;gap:3px;vertical-align:middle}

/* タグのタブ */
#tagView{margin-top:14px}
.tgbar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.tgbar button{display:inline-flex;align-items:center;gap:5px;padding:6px 12px;border-radius:999px;font-size:13.5px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
.tgbar button .c{font-size:11px;color:var(--dim)}
.tgbar button.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 20%,var(--panel));}
.tgbar button.add{color:var(--dim);border-style:dashed}
.tghead{display:flex;align-items:center;gap:10px;margin:4px 0 4px}
.tghead h3{margin:0;font-size:20px}
.tghead .ed{font-size:12px;padding:5px 10px;border-radius:8px;background:var(--panel2)}
.tgwords{font-size:12px;color:var(--faint);margin-bottom:12px}
.tgsum{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;margin-bottom:14px}
.gs{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--c);border-radius:10px;padding:9px 11px}
.gs b{font-size:15px}
.gs .gl{font-size:12px;color:var(--dim);margin-top:3px;line-height:1.6}
.gs .nx{color:var(--accent)}
.tgtab{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
/* 日記でこのタグを付けた文章（Macの日記が置いていく。ここでは見るだけ） */
.tgnk{margin-top:16px}
.tgnk h4{margin:0 0 8px;font-size:13px;font-weight:600;color:var(--dim)}
.tgnk .nr{display:grid;grid-template-columns:118px 1fr;gap:8px;padding:8px 10px;border-top:1px solid var(--line);font-size:13.5px;line-height:1.7}
.tgnk .nr:first-of-type{border-top:0}
.tgnk .nr .d{color:var(--dim)}
.tgnk .box{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--c);border-radius:12px;overflow:hidden}
@media (max-width:640px){ .tgnk .nr{grid-template-columns:1fr;gap:2px} }
.tr{display:grid;grid-template-columns:118px 26px 1fr 110px minmax(0,190px) 28px;gap:8px;align-items:center;padding:8px 10px;border-top:1px solid var(--line);font-size:13.5px;cursor:pointer}
.tr:first-child{border-top:0}
.tr:hover{background:var(--panel2)}
.tr.th{cursor:default;font-size:11px;color:var(--dim);letter-spacing:.06em;background:var(--panel2)}
.tr .d{font-variant-numeric:tabular-nums;color:var(--dim);font-size:12.5px}
.tr .w{color:var(--accent);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tr .tt2{min-width:0;word-break:break-word}
.tr .tt2 small{display:block;color:var(--faint);font-size:11px}
.tr.done .tt2{text-decoration:line-through;opacity:.6}
@media (max-width:760px){
  .tr{grid-template-columns:76px 22px 1fr 26px}
  .tr .w,.tr .ot{display:none}
  .tr.th .w,.tr.th .ot{display:none}
}

/* 直す画面のタグ */
.etags{display:flex;flex-wrap:wrap;gap:6px}
.etags button{padding:5px 10px;border-radius:999px;font-size:13px;border:1px solid var(--line);color:var(--dim);background:var(--bg)}
.etags button.on{color:var(--c);border-color:var(--c);background:color-mix(in srgb,var(--c) 18%,var(--bg))}
.etags button.add{border-style:dashed}

/* タグを作る・直す */
.tsheet{z-index:31} .tsheet-bg{z-index:30}
.pal{display:flex;gap:8px;flex-wrap:wrap}
.pal button{width:28px;height:28px;border-radius:50%;border:2px solid transparent}
.pal button.on{border-color:var(--ink)}

/* 帯（今日を真ん中にした線） */
.strip{margin:14px 0 6px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:6px 4px;overflow:hidden}
.strip svg{display:block;width:100%;height:auto}
.strip text{font-size:11px;fill:var(--dim)}

/* 盤：左＝過去（記録）／真ん中＝今日／右＝未来（期限） */
.board{display:grid;grid-template-columns:1fr 2px 1fr;gap:18px;margin-top:40px}
.col h2{min-height:20px}
.col h2{font-size:12px;letter-spacing:.12em;color:var(--dim);font-weight:600;margin:0 0 8px;display:flex;gap:6px;align-items:center}
.col.past h2{justify-content:flex-end}
.mid{background:linear-gradient(var(--accent),transparent);border-radius:2px;position:relative}
.mid span{position:absolute;top:-30px;left:50%;transform:translateX(-50%);background:var(--accent);color:#111;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
.list{display:flex;flex-direction:column;gap:8px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;gap:10px;align-items:flex-start;cursor:pointer;position:relative}
.card:hover{border-color:#3d4350}
.card .ic{font-size:20px;line-height:1.2;width:24px;text-align:center;flex:none}
.card .bd{flex:1;min-width:0}
.card .tt{font-size:15px;word-break:break-word}
.card .mt{font-size:12px;color:var(--dim);margin-top:2px;display:flex;flex-wrap:wrap;gap:4px 10px}
.card .rt{flex:none;text-align:right}
.card .big{font-size:18px;font-weight:700;white-space:nowrap;line-height:1.1}
.card .sm{font-size:11px;color:var(--dim);white-space:nowrap}
.card.due .big{color:var(--due)}
.card.due.soon{border-color:rgba(255,107,94,.45)} .card.due.soon .big{color:var(--due2)}
.card.due.over{background:rgba(255,107,94,.08);border-color:var(--due2)} .card.due.over .big{color:var(--due2)}
.card.log .big{color:var(--log);font-size:16px}
.card.done{opacity:.72} .card.done .tt{text-decoration:line-through;text-decoration-color:var(--faint)}
.bar{height:4px;background:var(--panel2);border-radius:4px;margin-top:7px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--due);border-radius:4px}
.card.soon .bar i,.card.over .bar i{background:var(--due2)}
.ck{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--faint);margin-top:1px;display:flex;align-items:center;justify-content:center;font-size:13px;color:transparent}
.ck:hover{border-color:var(--ok);color:var(--ok)}
.who{color:var(--accent)}
.empty{color:var(--faint);font-size:13px;padding:14px;border:1px dashed var(--line);border-radius:12px;text-align:center}
.sub{font-size:12px;color:var(--dim);margin:14px 0 6px;letter-spacing:.08em}
.more{font-size:12px;color:var(--dim);padding:6px;text-align:center}

/* 狭い画面（iPhone）：上＝未来（近いほど下）→ 今日 → 下＝過去（近いほど上） */
@media (max-width:760px){
  .board{grid-template-columns:1fr;gap:0;margin-top:16px}
  .col.fut{order:1} .mid{order:2;height:2px;margin:18px 0 22px;background:var(--accent)} .col.past{order:3}
  .mid span{top:50%;transform:translate(-50%,-50%)}
  .col.fut .list.main{flex-direction:column-reverse}
  .col.past h2{justify-content:flex-start}
}

/* 直すシート */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;display:none}
.sheet{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(560px,100%);background:var(--panel);border:1px solid var(--line);border-bottom:0;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));z-index:21;display:none}
.sheet.on,.sheet-bg.on{display:block}
.sheet label{display:block;font-size:12px;color:var(--dim);margin:10px 0 4px}
.sheet input,.sheet textarea{width:100%;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:9px 11px;font:inherit;font-size:16px}
.row{display:flex;gap:8px;align-items:center}
.seg{display:flex;background:var(--bg);border-radius:10px;padding:3px;border:1px solid var(--line)}
.seg button{flex:1;padding:7px 10px;border-radius:8px;color:var(--dim)}
.seg button.on{background:var(--panel2);color:var(--ink)}
.btns{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.btn{padding:10px 14px;border-radius:10px;background:var(--panel2);font-size:14px}
.btn.pri{background:var(--accent);color:#111;font-weight:700}
.btn.warn{color:var(--due2)}
.raw{font-size:12px;color:var(--faint);margin-top:2px;word-break:break-all}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#2b303a;color:var(--ink);padding:10px 14px;border-radius:12px;font-size:14px;z-index:30;display:none;gap:12px;align-items:center;box-shadow:0 6px 20px rgba(0,0,0,.4)}
.toast.on{display:flex}
.toast{max-width:calc(100% - 32px)} .toast button{color:var(--accent);font-weight:700;white-space:nowrap;flex:none}
.foot{text-align:center;color:var(--faint);font-size:11px;margin-top:30px}
.keybox{background:rgba(255,209,102,.1);border:1px solid rgba(255,209,102,.35);color:var(--accent);border-radius:10px;padding:8px 12px;font-size:13px;margin-top:8px}

/* Macの⌥⌘K 入力窓（?quick=1）：入力と読み取りだけ */
body.quick .strip,body.quick .board,body.quick .cal,body.quick .foot{display:none}
body.quick .top{position:static;border:0}
body.quick #inp{font-size:18px}
.qonly{display:none} body.quick .qonly{display:inline-flex}
.recent{display:none;margin-top:8px}
body.quick .recent{display:block}
.recent div{font-size:12.5px;color:var(--dim);padding:3px 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

@media (prefers-color-scheme:light){
  :root{--bg:#f5f6f8;--panel:#fff;--panel2:#eef0f3;--line:#dfe2e7;--ink:#1b1e24;--dim:#6b7280;--faint:#9aa1ad;--due:#d9822b;--due2:#e0443a;--log:#1f8fd6;--ok:#22a35a;--accent:#e2a400}
  .mid span{color:#fff}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="head"><b>ぽっと</b><nav class="tabs"><button data-tab="home">ホーム</button><button data-tab="tags">🏷 タグ</button></nav><span class="sp"></span><button class="qonly chip" id="openAll">一覧を開く ↗</button><span id="syncTxt"></span><span class="dot" id="syncDot"></span></div>
    <textarea id="inp" rows="1" placeholder="書いて Enter（例：日曜までに片付け）" autocomplete="off" autocapitalize="off" enterkeyhint="done"></textarea>
    <div class="pv" id="pv"><span class="hint">「〜までに」「来週金曜」→ 期限／「〜した」「〜入った」→ 記録</span></div>
    <div id="keyNote"></div>
    <div class="recent" id="recent"></div>
  </div>

  <div class="cal" id="cal">
    <div class="cp cm"><div class="ch"><span class="tg">月</span><button class="nv" data-nav="m-1">‹</button><span class="lbl" id="mLbl"></span><button class="nv" data-nav="m1">›</button></div><div class="mg" id="mGrid"></div></div>
    <div class="cp cw"><div class="ch"><span class="tg">週</span><button class="nv" data-nav="w-1">‹</button><span class="lbl" id="wLbl"></span><button class="nv" data-nav="w1">›</button></div><div class="wg" id="wGrid"></div></div>
    <div class="cp cd"><div class="ch"><span class="tg">日</span><button class="nv" data-nav="d-1">‹</button><span class="lbl" id="dLbl"></span><button class="nv" data-nav="d1">›</button><button class="td" data-nav="today">今日</button></div><div class="dl" id="dList"></div></div>
  </div>

  <div id="tagView">
    <div class="tgbar" id="tgBar"></div>
    <div id="tgBody"></div>
  </div>

  <div class="strip" id="strip"></div>

  <div class="board">
    <div class="col past">
      <h2>← 記録（やったこと）</h2>
      <div class="list" id="pastList"></div>
    </div>
    <div class="mid"><span id="todayLbl">今日</span></div>
    <div class="col fut">
      <h2>期限（〜までに）→</h2>
      <div class="list main" id="futList"></div>
      <div id="undated"></div>
    </div>
  </div>
  <div class="foot" id="foot"></div>
</div>

<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet">
  <div class="seg" id="kSeg"><button data-k="log">📝 記録（やった）</button><button data-k="due">⏳ 期限（までに）</button></div>
  <label>なにを</label>
  <input id="eTitle">
  <div class="raw" id="eRaw"></div>
  <div class="row">
    <div style="flex:1"><label id="eDateLbl">いつ</label><input id="eDate" type="date"></div>
    <div style="width:42%"><label>時刻（なくてもいい）</label><input id="eTime" type="time"></div>
  </div>
  <label>タグ（いくつでも。押すと付く／外れる）</label>
  <div class="etags" id="eTags"></div>
  <label>だれ（期限をくれた人／会った人）</label>
  <input id="eWho" placeholder="例：オーナー／田中さん／タック">
  <div class="btns">
    <button class="btn pri" id="eSave">とじる</button>
    <button class="btn" id="eDone"></button>
    <span style="flex:1"></span>
    <button class="btn warn" id="eDel">消す</button>
  </div>
</div>
<div class="sheet-bg tsheet-bg" id="tSheetBg"></div>
<div class="sheet tsheet" id="tSheet">
  <div class="row"><div style="width:84px"><label>絵文字</label><input id="tEmoji" maxlength="4"></div><div style="flex:1"><label>タグの名前</label><input id="tName" placeholder="例：薬／会った／買ったもの"></div></div>
  <label>色</label>
  <div class="pal" id="tPal"></div>
  <label>この言葉が入っていたら自動で付く（、で区切る・空でもいい）</label>
  <textarea id="tWords" rows="2" placeholder="例：薬、サプリ、目薬"></textarea>
  <label>表のまとめ方</label>
  <div class="seg" id="tBy"><button data-by="what">なにごと（睡眠薬・ロキソニン…）</button><button data-by="who">人ごと（タック・田中さん…）</button></div>
  <div class="btns">
    <button class="btn pri" id="tSave">保存</button>
    <button class="btn" id="tClose">とじる</button>
    <span style="flex:1"></span>
    <button class="btn warn" id="tDel">このタグを消す</button>
  </div>
</div>
<div class="toast" id="toast"><span id="toastTxt"></span><button id="toastBtn">元に戻す</button></div>

<script src="parse.js?v=2026-10-19-3"></script>
<script>
const APP_VERSION = '2026-10-20-1';
const GAS = 'https://script.google.com/macros/s/AKfycbyX-ywN70IMoxiLOF3VyRgje4y85_ilLzhyWfqszCvaEevBNjxtX62tboVMyGvht9VGbw/exec';
const Q = new URLSearchParams(location.search);
const QUICK = Q.get('quick') === '1';
const HS = window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.potto;
const tell = m => { try { HS && HS.postMessage(m); } catch (e) {} };
const $ = id => document.getElementById(id);
const DAY = 86400000;
if (QUICK) document.body.classList.add('quick');

/* ---------- 保存（端末の中）---------- */
const LS = {
  get(k, d) { try { const v = localStorage.getItem('potto.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('potto.' + k, JSON.stringify(v)); } catch (e) {} },
};
// 合言葉は #k=… で1回だけ渡す（コードには書かない）
(function () {
  // iPhone：Safariとホーム画面のアプリは保存場所が別。?k= を付けたままホーム画面に追加すれば、アプリ側も最初から合言葉を持つ
  const q = Q.get('k');
  if (q && /^[A-Za-z0-9]+$/.test(q)) LS.set('key', q);
  const m = /[#&]k=([A-Za-z0-9]+)/.exec(location.hash);
  if (m) { LS.set('key', m[1]); history.replaceState(null, '', location.pathname + location.search); }
})();
let KEY = LS.get('key', '');
let items = LS.get('items', {});        // id → item
let pending = LS.get('pending', []);    // まだ棚に届いていない id
let lastS = LS.get('lastS', 0);
const saveLocal = () => { LS.set('items', items); LS.set('pending', pending); LS.set('lastS', lastS); };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

function touch(it) { it.u = Date.now(); items[it.id] = it; if (!pending.includes(it.id)) pending.push(it.id); saveLocal(); render(); schedulePush(); }

/* ---------- 同期 ---------- */
let pushT = null, busy = false, lastOk = 0, lastErr = '';
function setSync(state, txt) { $('syncDot').className = 'dot ' + state; $('syncTxt').textContent = txt || ''; }
function schedulePush(ms) { clearTimeout(pushT); pushT = setTimeout(push, ms == null ? 250 : ms); }
async function push() {
  if (!KEY) return setSync('', '同期なし');
  if (!pending.length) return;
  if (busy) return schedulePush(800);
  busy = true; setSync('busy', '送信中');
  const ids = pending.slice(), sent = ids.map(id => items[id]).filter(Boolean);
  const snap = {}; sent.forEach(it => snap[it.id] = it.u);
  try {
    const r = await fetch(GAS + '?op=put&key=' + KEY, { method: 'POST', body: JSON.stringify({ items: sent }) });   // text/plain のまま（独自ヘッダはGASに届かない）
    const j = await r.json();
    if (!j.ok) throw new Error(j.err || 'ng');
    pending = pending.filter(id => !(id in snap) || (items[id] && items[id].u !== snap[id]));
    (j.kept || []).forEach(it => { items[it.id] = it; });
    saveLocal(); lastOk = Date.now(); setSync('ok', '');
    tell('pushed');
    busy = false;
    if (pending.length) schedulePush(300); else pull();
  } catch (e) { busy = false; lastErr = String(e); setSync('ng', 'あとで送る'); schedulePush(15000); }
}
async function pull() {
  if (!KEY || busy) return;
  try {
    const r = await fetch(GAS + '?op=get&key=' + KEY + '&since=' + lastS + '&t=' + Date.now());
    const j = await r.json();
    if (!j.ok) { setSync('ng', j.err === 'key' ? '合言葉ちがい' : 'エラー'); return; }
    let changed = false;
    j.items.forEach(it => {
      const cur = items[it.id];
      if (pending.includes(it.id) && cur && cur.u > it.u) return;          // こちらで書きかけの方が新しい
      if (!cur || it.u >= cur.u || it.rid !== cur.rid || it.s !== cur.s) { items[it.id] = it; changed = true; }
    });
    lastS = Math.max(lastS, j.now || 0); saveLocal();
    lastOk = Date.now(); if (!pending.length) setSync('ok', '');
    if (changed) render();
  } catch (e) { setSync('ng', 'オフライン'); }
}

/* ---------- タグ（いくつでも付く。定義は '_tags' として同期） ---------- */
const PAL = ['#6fdc9a', '#c49bff', '#ffd166', '#ff7a9c', '#5ee0d0', '#ffb347', '#6cc6ff', '#a0a8b8'];
const DEFAULT_TAGS = [
  { id: 'kusuri', name: '薬', emoji: '💊', color: '#6fdc9a', words: '薬、サプリ、処方、目薬、ロキソニン、バファリン', by: 'what' },
  { id: 'atta', name: '会った', emoji: '👥', color: '#c49bff', words: 'と会、に会、とご飯、とごはん、と飲み、と遊、とお茶、とランチ', by: 'who' },
  { id: 'katta', name: '買ったもの', emoji: '🛒', color: '#ffd166', words: '買、購入、注文、ポチ', by: 'what' },
  { id: 'sub', name: 'サブスク', emoji: '💳', color: '#ff7a9c', words: 'サブスク、入会、契約、解約、Netflix、ネトフリ、Spotify、アマプラ', by: 'what' },
  { id: 'byouin', name: '体・病院', emoji: '🏥', color: '#5ee0d0', words: '病院、歯医者、通院、検診、健診、クリニック', by: 'what' },
  { id: 'ie', name: '家', emoji: '🏠', color: '#ffb347', words: '片付け、片づけ、掃除、洗濯、整理', by: 'what' },
  { id: 'tetsuzuki', name: '手続き', emoji: '📄', color: '#6cc6ff', words: '書類、提出、申請、役所、手続', by: 'what' },
  { id: 'midashi', name: '身だしなみ', emoji: '✂️', color: '#a0a8b8', words: '髪、美容院、散髪、床屋、ネイル', by: 'what' },
];
const tagDefs = () => (items._tags && !items._tags.del && Array.isArray(items._tags.list)) ? items._tags.list : DEFAULT_TAGS;
const tagById = id => tagDefs().find(t => t.id === id);
function saveTags(list) { const cur = items._tags || { id: '_tags', kind: 'tags', c: Date.now() }; touch(Object.assign({}, cur, { list, del: false })); }
const realItems = () => Object.values(items).filter(x => !x.del && (x.kind === 'log' || x.kind === 'due'));
// 日記（Mac）でこのタグを付けた文章。日ごとに1件（kind 'nikki'）で届く
const nikkiRows = id => Object.values(items).filter(x => x.kind === 'nikki' && !x.del && x.date)
  .flatMap(x => (x.list || []).filter(r => r.pid === id).map(r => ({ date: x.date, text: r.text })))
  .sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : 0));
const wordsOf = t => String(t.words || '').split(/[、,，\s]+/).map(w => w.trim()).filter(Boolean);
function autoTags(x) {
  const text = (x.title || '') + ' ' + (x.raw || '');
  return tagDefs().filter(t => wordsOf(t).some(w => text.includes(w))).map(t => t.id);
}
function tagIds(x) {   // 付いているタグ＝自分で付けた分＋自動の分−外した分
  const no = x.notags || [], ids = [...(x.tags || []), ...autoTags(x)];
  return [...new Set(ids)].filter(id => !no.includes(id) && tagById(id));
}
const tchip = t => `<span class="tchip" style="--c:${t.color}">${t.emoji || '🏷'}${esc(t.name)}</span>`;
const tchips = x => { const ts = tagIds(x).map(tagById); return ts.length ? `<span class="tchips">${ts.map(tchip).join('')}</span>` : ''; };
function idsFromNames(names) {   // 「#薬」→ タグのID。無い名前は新しく作る
  if (!names || !names.length) return [];
  let list = tagDefs().slice(), made = false;
  const ids = names.map(n => {
    let t = list.find(t => t.name.toLowerCase() === n.toLowerCase());
    if (!t) { t = { id: uid(), name: n, emoji: '🏷', color: PAL[list.length % PAL.length], words: '', by: 'what' }; list.push(t); made = true; }
    return t.id;
  });
  if (made) saveTags(list);
  return ids;
}

/* ---------- 入力 ---------- */
const inp = $('inp');
let override = null, composing = false, compEnd = 0;
inp.addEventListener('compositionstart', () => composing = true);
inp.addEventListener('compositionend', () => { composing = false; compEnd = Date.now(); });
function grow() { inp.style.height = ''; if (inp.value) inp.style.height = Math.min(inp.scrollHeight + 2, 160) + 'px'; }
inp.addEventListener('input', () => { override = null; grow(); preview(); });
inp.addEventListener('keydown', e => {
  if (e.key === 'Escape') { inp.value = ''; preview(); tell('close'); return; }
  if (e.key !== 'Enter' || e.shiftKey) return;
  if (e.isComposing || composing || e.keyCode === 229 || Date.now() - compEnd < 80) return;   // 日本語の確定Enterでは入れない
  e.preventDefault(); add();
});
function readNow() {
  const r = PottoParse.parse(inp.value);
  if (override && override !== r.kind) {
    r.kind = override;
    if (override === 'log' && (!r.at || r.at > Date.now())) r.at = Date.now();
    if (override === 'due' && r.at && r.at <= Date.now()) r.at = null;
  }
  return r;
}
function preview() {
  const v = inp.value.trim(), pv = $('pv');
  if (!v) { pv.innerHTML = '<span class="hint">「〜までに」「来週金曜」→ 期限／「〜した」「〜入った」→ 記録' + (QUICK ? '　Enterで入れる・Escで閉じる' : '') + '</span>'; return; }
  const r = readNow();
  const k = r.kind === 'due'
    ? `<button class="chip k-due" id="flip" title="押すと記録に変える">⏳ 期限</button>`
    : `<button class="chip k-log" id="flip" title="押すと期限に変える">📝 記録</button>`;
  const when = r.kind === 'due' ? (r.at ? fmtDate(r.at, r.hasTime) + ' まで' : 'いつまで？（未定）') : fmtDate(r.at, r.hasTime);
  pv.innerHTML = k + `<span class="chip">${esc(when)}</span><span class="chip">${r.icon || '・'} ${esc(r.title)}</span>` + (r.who ? `<span class="chip who">👤 ${esc(r.who)}</span>` : '') + previewTags(r) + `<span class="hint">⏎</span>`;
  $('flip').onclick = () => { override = r.kind === 'due' ? 'log' : 'due'; preview(); inp.focus(); };
}
function previewTags(r) {
  const known = (r.tagNames || []).map(n => tagDefs().find(t => t.name.toLowerCase() === n.toLowerCase()));
  const ts = [...new Set([...autoTags(r), ...known.filter(Boolean).map(t => t.id)])].map(tagById).filter(Boolean);
  const fresh = (r.tagNames || []).filter((n, i) => !known[i]).map(n => tchip({ name: n + '（新）', emoji: '🏷', color: 'var(--dim)' }));
  return ts.map(tchip).join('') + fresh.join('');
}
function add() {
  const v = inp.value.trim(); if (!v) return;
  const r = readNow(), now = Date.now();
  const it = Object.assign({ id: uid(), c: now, done: false }, r);
  it.tags = idsFromNames(r.tagNames); delete it.tagNames;
  inp.value = ''; override = null; grow(); preview();
  touch(it);
  showRecent(it);
  toast((it.kind === 'due' ? '⏳ 期限に入れた' : '📝 記録した') + '：' + it.title, () => { it.del = true; touch(it); });
  if (QUICK) { schedulePush(0); tell('added|' + (it.kind === 'due' ? '⏳ ' + (it.at ? fmtDate(it.at, it.hasTime) + ' まで' : '期限未定') : '📝 記録') + '：' + it.title); }
}
function showRecent(it) {
  if (!QUICK) return;
  const list = realItems().sort((a, b) => b.c - a.c).slice(0, 3);
  $('recent').innerHTML = list.map(x => `<div>${x.kind === 'due' ? '⏳' : '📝'} ${esc(x.title)} <span style="color:var(--faint)">— ${x.kind === 'due' ? (x.at ? fmtDate(x.at, x.hasTime) + 'まで' : '期限未定') : fmtDate(x.at, x.hasTime)}</span></div>`).join('');
}

/* ---------- 表示 ---------- */
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const W = '日月火水木金土';
const d0 = ms => { const d = new Date(ms); d.setHours(0, 0, 0, 0); return d.getTime(); };
const p2 = n => String(n).padStart(2, '0');
function fmtDate(ms, hasTime) {
  if (ms == null) return '';
  const d = new Date(ms), now = new Date();
  let s = `${d.getMonth() + 1}/${d.getDate()}(${W[d.getDay()]})`;
  if (d.getFullYear() !== now.getFullYear()) s = d.getFullYear() + '/' + s;
  if (hasTime) s += ' ' + d.getHours() + ':' + p2(d.getMinutes());
  return s;
}
const calDays = (a, b) => Math.round((d0(b) - d0(a)) / DAY);
function leftTxt(it, now) {   // 期限まで
  const ms = it.at - now, days = calDays(now, it.at);
  if (ms < 0) {
    const ago = -ms;
    return ago < DAY ? Math.max(1, Math.round(ago / 3600000)) + '時間すぎ' : Math.round(ago / DAY) + '日すぎ';
  }
  if (ms < 3600000) return 'あと' + Math.max(1, Math.round(ms / 60000)) + '分';
  if (days === 0) return it.hasTime ? 'あと' + Math.round(ms / 3600000) + '時間' : '今日まで';
  if (days === 1) return '明日まで';
  if (days >= 60) return 'あと' + Math.round(days / 30) + 'か月';
  return 'あと' + days + '日';
}
function agoTxt(ms, now) {
  const days = calDays(ms, now);
  if (days <= 0) return '今日'; if (days === 1) return '昨日';
  if (days >= 365) return (days / 365).toFixed(1).replace('.0', '') + '年前';
  if (days >= 60) return Math.round(days / 30) + 'か月前';
  return days + '日前';
}
const spanTxt = d => d >= 60 ? Math.round(d / 30) + 'か月' : d + '日';

function render() {
  if (QUICK) return;
  const now = Date.now();
  const all = realItems();
  drawTags(all, now);
  const dues = all.filter(x => x.kind === 'due' && !x.done && x.at != null).sort((a, b) => a.at - b.at);
  const undated = all.filter(x => x.kind === 'due' && !x.done && x.at == null).sort((a, b) => b.c - a.c);
  // 済んだ期限は「やったこと」として過去側に出す
  const logs = all.filter(x => x.kind === 'log' || x.done).map(x => x.kind === 'log' ? x : Object.assign({}, x, { _done: true, at: x.doneAt || x.u }))
    .sort((a, b) => b.at - a.at);

  // 同じ束（髪 等）の前回との間・平均
  const groups = {};
  logs.slice().reverse().forEach(x => { if (x._done) return; const k = PottoParse.groupKey(x.title); (groups[k] = groups[k] || []).push(x); });

  const t = new Date();
  $('todayLbl').textContent = `今日 ${t.getMonth() + 1}/${t.getDate()}(${W[t.getDay()]})`;

  $('futList').innerHTML = dues.length ? dues.map(x => dueCard(x, now)).join('') : '<div class="empty">期限はまだ無い<br>「日曜までに片付け」と書くとここに並ぶ</div>';
  $('undated').innerHTML = undated.length ? '<div class="sub">いつまで？（期限が決まっていない）</div><div class="list">' + undated.map(x => dueCard(x, now)).join('') + '</div>' : '';
  const LIM = showAll ? 9999 : 40;
  $('pastList').innerHTML = (logs.length ? logs.slice(0, LIM).map(x => logCard(x, now, groups)).join('') : '<div class="empty">記録はまだ無い<br>「髪切った」と書くとここに並ぶ</div>')
    + (logs.length > LIM ? `<button class="more" id="moreBtn">ほか ${logs.length - LIM} 件を見る</button>` : '');
  if ($('moreBtn')) $('moreBtn').onclick = () => { showAll = true; render(); };
  drawStrip(dues, logs, now);
  drawCal(all, now);
  document.querySelectorAll('[data-id]').forEach(el => el.onclick = e => {
    if (e.target.closest('.ck')) { e.stopPropagation(); markDone(el.dataset.id); return; }
    if (e.target.closest('.xx')) { e.stopPropagation(); delItem(el.dataset.id); return; }
    openSheet(el.dataset.id);
  });
}
/* ---------- カレンダー（月・週・日を同時に） ---------- */
let selDay = d0(Date.now()), monCur = null;   // monCur＝月の欄で見ている月の1日
const monFirst = ms => { const d = new Date(ms); return new Date(d.getFullYear(), d.getMonth(), 1).getTime(); };
const addDay = (ms, n) => { const d = new Date(ms); d.setDate(d.getDate() + n); return d0(d.getTime()); };
const monday = ms => addDay(ms, -((new Date(ms).getDay() + 6) % 7));
const wcls = dw => dw === 6 ? 'sat' : dw === 0 ? 'sun' : '';
function setSel(ms) { selDay = d0(ms); monCur = monFirst(selDay); render(); }
document.querySelectorAll('[data-nav]').forEach(b => b.onclick = () => {
  const v = b.dataset.nav;
  if (v === 'today') return setSel(Date.now());
  const n = Number(v.slice(1));
  if (v[0] === 'm') { const d = new Date(monCur); monCur = new Date(d.getFullYear(), d.getMonth() + n, 1).getTime(); render(); }
  if (v[0] === 'w') setSel(addDay(selDay, 7 * n));
  if (v[0] === 'd') setSel(addDay(selDay, n));
});
function calEntries(all) {   // 日ごとの中身（期限は締めの日、記録はやった日）
  const by = {};
  all.forEach(x => {
    if (x.at == null) return;
    (by[d0(x.at)] = by[d0(x.at)] || []).push(x);
  });
  Object.values(by).forEach(a => a.sort((p, q) => (p.kind === q.kind ? 0 : p.kind === 'due' ? -1 : 1) || p.at - q.at));
  return by;
}
function ciCls(x, now) { return 'ci ' + x.kind + (x.done ? ' done' : '') + (x.kind === 'due' && !x.done && x.at < now ? ' over' : ''); }
function drawCal(all, now) {
  if (!monCur) monCur = monFirst(selDay);
  const by = calEntries(all), today = d0(now), wk0 = monday(selDay);
  // 月
  const mf = new Date(monCur);
  $('mLbl').textContent = `${mf.getFullYear()}年${mf.getMonth() + 1}月`;
  const start = monday(monCur), last = new Date(mf.getFullYear(), mf.getMonth() + 1, 0).getTime();
  const weeks = Math.ceil((Math.round((d0(last) - start) / DAY) + 1) / 7);
  let m = '月火水木金土日'.split('').map((w, i) => `<div class="mw ${wcls((i + 1) % 7)}">${w}</div>`).join('');
  for (let i = 0; i < weeks * 7; i++) {
    const day = addDay(start, i), d = new Date(day), es = by[day] || [];
    const cls = ['mc', d.getMonth() !== mf.getMonth() ? 'out' : '', day === today ? 'today' : '', day === selDay ? 'sel' : '', day >= wk0 && day < addDay(wk0, 7) ? 'inweek' : ''].join(' ');
    const lines = es.slice(0, 3).map(x => `<div class="mi ${x.kind}${x.done ? ' done' : ''}">${x.icon || (x.kind === 'due' ? '⏳' : '・')}${esc(x.title)}</div>`).join('') + (es.length > 3 ? `<div class="mi more">+${es.length - 3}</div>` : '');
    const dots = es.slice(0, 6).map(x => `<i style="background:var(--${x.kind === 'due' ? 'due' : 'log'})"></i>`).join('');
    m += `<div class="${cls}" data-day="${day}"><span class="n ${wcls(d.getDay())}">${d.getDate()}</span>${lines}<div class="mdots">${dots}</div></div>`;
  }
  $('mGrid').innerHTML = m;
  // 週
  const we = addDay(wk0, 6), a = new Date(wk0), b = new Date(we);

/* 帯：今日を真ん中に、左＝過去の記録、右＝未来の期限。近いほど広く（平方根の目盛り） */
function drawStrip(dues, logs, now) {
  const el = $('strip');
  const narrow = (el.clientWidth || document.documentElement.clientWidth || 1024) < 700;
  const Wd = narrow ? 360 : 1060, H = narrow ? 176 : 160, cx = Wd / 2, half = Wd / 2 - 14, axis = narrow ? 100 : H / 2 + 6;
  const far = Math.max(30, ...dues.map(x => calDays(now, x.at)).filter(d => d > 0).map(d => Math.min(d, 365)), ...logs.slice(0, 30).map(x => Math.min(365, calDays(x.at, now))));
  const R = Math.min(365, Math.ceil(far / 30) * 30 || 30);
  const X = d => cx + Math.sign(d) * Math.sqrt(Math.min(Math.abs(d), R) / R) * half;
  let s = `<svg viewBox="0 0 ${Wd} ${H}" xmlns="http://www.w3.org/2000/svg">`;
  s += `<line x1="8" y1="${axis}" x2="${Wd - 8}" y2="${axis}" style="stroke:var(--line);stroke-width:2"/>`;
  [7, 30, 90, 180, 365].filter(d => d <= R).forEach(d => {
    [-d, d].forEach(v => {
      const x = X(v);
      s += `<line x1="${x}" y1="${axis - 4}" x2="${x}" y2="${axis + 4}" style="stroke:var(--faint)"/>`;
      s += `<text x="${x}" y="${H - 4}" text-anchor="middle" style="fill:var(--faint);font-size:10px">${d === 7 ? '1週' : d === 30 ? '1か月' : d === 90 ? '3か月' : d === 180 ? '半年' : '1年'}${v < 0 ? '前' : '後'}</text>`;
    });
  });
  s += `<line x1="${cx}" y1="10" x2="${cx}" y2="${H - 16}" style="stroke:var(--accent);stroke-width:2"/>`;
  s += `<text x="${cx}" y="10" text-anchor="middle" style="fill:var(--accent);font-weight:700">今日</text>`;
  // ラベルが重ならないように段をずらす
  const place = (arr, up, color) => {
    const rows = [];
    arr.forEach(o => {
      const x = o.x, w = Math.min(130, 14 + o.label.length * 11);
      let r = 0; while (rows[r] && rows[r].some(([a, b]) => !(x + w / 2 < a || x - w / 2 > b))) r++;
      if (r > 2) { s += `<circle cx="${x}" cy="${axis}" r="3.5" style="fill:${color}"/>`; return; }
      (rows[r] = rows[r] || []).push([x - w / 2, x + w / 2]);
      const y = up ? axis - 16 - r * 17 : axis + 20 + r * 17;
      s += `<line x1="${x}" y1="${axis}" x2="${x}" y2="${up ? y + 3 : y - 11}" style="stroke:${color};stroke-opacity:.5"/>`;
      s += `<circle cx="${x}" cy="${axis}" r="4.5" style="fill:${color}"/>`;
      s += `<text x="${x}" y="${y}" text-anchor="middle" style="fill:${color}">${esc(o.label)}</text>`;
    });
  };
  const trunc = (t, n) => t.length > n ? t.slice(0, n) + '…' : t;
  const n = narrow ? 5 : 9;
  place(dues.slice(0, 14).map(x => ({ x: X(calDays(now, x.at) + (x.at < now ? -0.01 : 0)), label: (x.icon || '') + trunc(x.title, n) })), true, 'var(--due)');
  place(logs.slice(0, 14).map(x => ({ x: X(-calDays(x.at, now)), label: (x._done ? '✓' : (x.icon || '')) + trunc(x.title, n) })), false, 'var(--log)');
  s += '</svg>';
  el.innerHTML = s;
}

  }).join('') + '</div>' + nkHtml;

$('foot').textContent = 'v' + APP_VERSION;

let checking = false;
async function checkVersion() {
  if (checking || !navigator.onLine) return; checking = true;
  try {
    const r = await fetch('version.txt?t=' + Date.now(), { cache: 'no-store' });
    if (r.ok) {
      const latest = (await r.text()).trim();
      if (latest && latest !== APP_VERSION && sessionStorage.getItem('reloaded_for') !== latest) { sessionStorage.setItem('reloaded_for', latest); location.reload(); }
    }
  } catch (e) {} finally { checking = false; }
}
checkVersion();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
