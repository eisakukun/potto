<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ぽっと</title>
<meta name="theme-color" content="#111318">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ぽっと">
<style>
:root{
  --bg:#111318; --panel:#1a1d24; --panel2:#22262f; --line:#2e333d; --ink:#e9ebef; --dim:#8a919e; --faint:#5b6270;
  --due:#ffb347; --due2:#ff6b5e; --log:#6cc6ff; --ok:#6fdc9a; --accent:#ffd166;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif;-webkit-text-size-adjust:100%}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
.wrap{max-width:1100px;margin:0 auto;padding:10px 16px 40px}

/* 入力 */
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0 10px;margin:0 -16px;padding-left:16px;padding-right:16px;border-bottom:1px solid var(--line)}
.head{display:flex;align-items:center;gap:8px;margin-bottom:6px;color:var(--dim);font-size:12px}
.head b{color:var(--ink);font-size:15px;letter-spacing:.05em}
.head .sp{flex:1}
.dot{width:8px;height:8px;border-radius:50%;background:var(--faint);display:inline-block}
.dot.ok{background:var(--ok)} .dot.busy{background:var(--accent)} .dot.ng{background:var(--due2)}
#inp{width:100%;resize:none;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font:inherit;font-size:17px;line-height:1.4;outline:none;min-height:48px}
#inp:focus{border-color:#4a5262}
.pv{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-height:26px;margin-top:6px;font-size:13px;color:var(--dim)}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;background:var(--panel2);font-size:12.5px;color:var(--ink);white-space:nowrap}
.chip.k-due{background:rgba(255,179,71,.16);color:var(--due)} .chip.k-log{background:rgba(108,198,255,.14);color:var(--log)}
button.chip{border:1px dashed transparent} button.chip:hover{border-color:var(--faint)}
.hint{color:var(--faint);font-size:12px}

/* 帯（今日を真ん中にした線） */
.strip{margin:14px 0 6px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:6px 4px;overflow:hidden}
.strip svg{display:block;width:100%;height:auto}
.strip text{font-size:11px;fill:var(--dim)}

/* 盤：左＝過去（記録）／真ん中＝今日／右＝未来（期限） */
.board{display:grid;grid-template-columns:1fr 2px 1fr;gap:18px;margin-top:40px}
.col h2{min-height:20px}
.col h2{font-size:12px;letter-spacing:.12em;color:var(--dim);font-weight:600;margin:0 0 8px;display:flex;gap:6px;align-items:center}
.col.past h2{justify-content:flex-end}
.mid{background:linear-gradient(var(--accent),transparent);border-radius:2px;position:relative}
.mid span{position:absolute;top:-30px;left:50%;transform:translateX(-50%);background:var(--accent);color:#111;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
.list{display:flex;flex-direction:column;gap:8px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;gap:10px;align-items:flex-start;cursor:pointer;position:relative}
.card:hover{border-color:#3d4350}
.card .ic{font-size:20px;line-height:1.2;width:24px;text-align:center;flex:none}
.card .bd{flex:1;min-width:0}
.card .tt{font-size:15px;word-break:break-word}
.card .mt{font-size:12px;color:var(--dim);margin-top:2px;display:flex;flex-wrap:wrap;gap:4px 10px}
.card .rt{flex:none;text-align:right}
.card .big{font-size:18px;font-weight:700;white-space:nowrap;line-height:1.1}
.card .sm{font-size:11px;color:var(--dim);white-space:nowrap}
.card.due .big{color:var(--due)}
.card.due.soon{border-color:rgba(255,107,94,.45)} .card.due.soon .big{color:var(--due2)}
.card.due.over{background:rgba(255,107,94,.08);border-color:var(--due2)} .card.due.over .big{color:var(--due2)}
.card.log .big{color:var(--log);font-size:16px}
.card.done{opacity:.72} .card.done .tt{text-decoration:line-through;text-decoration-color:var(--faint)}
.bar{height:4px;background:var(--panel2);border-radius:4px;margin-top:7px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--due);border-radius:4px}
.card.soon .bar i,.card.over .bar i{background:var(--due2)}
.ck{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--faint);margin-top:1px;display:flex;align-items:center;justify-content:center;font-size:13px;color:transparent}
.ck:hover{border-color:var(--ok);color:var(--ok)}
.who{color:var(--accent)}
.empty{color:var(--faint);font-size:13px;padding:14px;border:1px dashed var(--line);border-radius:12px;text-align:center}
.sub{font-size:12px;color:var(--dim);margin:14px 0 6px;letter-spacing:.08em}
.more{font-size:12px;color:var(--dim);padding:6px;text-align:center}

/* 狭い画面（iPhone）：上＝未来（近いほど下）→ 今日 → 下＝過去（近いほど上） */
@media (max-width:760px){
  .board{grid-template-columns:1fr;gap:0;margin-top:16px}
  .col.fut{order:1} .mid{order:2;height:2px;margin:18px 0 22px;background:var(--accent)} .col.past{order:3}
  .mid span{top:50%;transform:translate(-50%,-50%)}
  .col.fut .list.main{flex-direction:column-reverse}
  .col.past h2{justify-content:flex-start}
}

/* 直すシート */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;display:none}
.sheet{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(560px,100%);background:var(--panel);border:1px solid var(--line);border-bottom:0;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));z-index:21;display:none}
.sheet.on,.sheet-bg.on{display:block}
.sheet label{display:block;font-size:12px;color:var(--dim);margin:10px 0 4px}
.sheet input,.sheet textarea{width:100%;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:9px 11px;font:inherit;font-size:16px}
.row{display:flex;gap:8px;align-items:center}
.seg{display:flex;background:var(--bg);border-radius:10px;padding:3px;border:1px solid var(--line)}
.seg button{flex:1;padding:7px 10px;border-radius:8px;color:var(--dim)}
.seg button.on{background:var(--panel2);color:var(--ink)}
.btns{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.btn{padding:10px 14px;border-radius:10px;background:var(--panel2);font-size:14px}
.btn.pri{background:var(--accent);color:#111;font-weight:700}
.btn.warn{color:var(--due2)}
.raw{font-size:12px;color:var(--faint);margin-top:2px;word-break:break-all}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#2b303a;color:var(--ink);padding:10px 14px;border-radius:12px;font-size:14px;z-index:30;display:none;gap:12px;align-items:center;box-shadow:0 6px 20px rgba(0,0,0,.4)}
.toast.on{display:flex}
.toast button{color:var(--accent);font-weight:700}
.foot{text-align:center;color:var(--faint);font-size:11px;margin-top:30px}
.keybox{background:rgba(255,209,102,.1);border:1px solid rgba(255,209,102,.35);color:var(--accent);border-radius:10px;padding:8px 12px;font-size:13px;margin-top:8px}

/* Macの⌥⌘K 入力窓（?quick=1）：入力と読み取りだけ */
body.quick .strip,body.quick .board,body.quick .foot{display:none}
body.quick .top{position:static;border:0}
body.quick #inp{font-size:18px}
.qonly{display:none} body.quick .qonly{display:inline-flex}
.recent{display:none;margin-top:8px}
body.quick .recent{display:block}
.recent div{font-size:12.5px;color:var(--dim);padding:3px 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

@media (prefers-color-scheme:light){
  :root{--bg:#f5f6f8;--panel:#fff;--panel2:#eef0f3;--line:#dfe2e7;--ink:#1b1e24;--dim:#6b7280;--faint:#9aa1ad;--due:#d9822b;--due2:#e0443a;--log:#1f8fd6;--ok:#22a35a;--accent:#e2a400}
  .mid span{color:#fff}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="head"><b>ぽっと</b><span>期限と記録</span><span class="sp"></span><button class="qonly chip" id="openAll">一覧を開く ↗</button><span id="syncTxt"></span><span class="dot" id="syncDot"></span></div>
    <textarea id="inp" rows="1" placeholder="書いて Enter（例：日曜までに片付け／髪切った）" autocomplete="off" autocapitalize="off" enterkeyhint="done"></textarea>
    <div class="pv" id="pv"><span class="hint">「〜までに」「来週金曜」→ 期限／「〜した」「〜入った」→ 記録</span></div>
    <div id="keyNote"></div>
    <div class="recent" id="recent"></div>
  </div>

  <div class="strip" id="strip"></div>

  <div class="board">
    <div class="col past">
      <h2>← 記録（やったこと）</h2>
      <div class="list" id="pastList"></div>
    </div>
    <div class="mid"><span id="todayLbl">今日</span></div>
    <div class="col fut">
      <h2>期限（〜までに）→</h2>
      <div class="list main" id="futList"></div>
      <div id="undated"></div>
    </div>
  </div>
  <div class="foot" id="foot"></div>
</div>

<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet">
  <div class="seg" id="kSeg"><button data-k="log">📝 記録（やった）</button><button data-k="due">⏳ 期限（までに）</button></div>
  <label>なにを</label>
  <input id="eTitle">
  <div class="raw" id="eRaw"></div>
  <div class="row">
    <div style="flex:1"><label id="eDateLbl">いつ</label><input id="eDate" type="date"></div>
    <div style="width:42%"><label>時刻（なくてもいい）</label><input id="eTime" type="time"></div>
  </div>
  <label>だれから（期限をくれた人）</label>
  <input id="eWho" placeholder="例：オーナー／田中さん">
  <div class="btns">
    <button class="btn pri" id="eSave">とじる</button>
    <button class="btn" id="eDone"></button>
    <span style="flex:1"></span>
    <button class="btn warn" id="eDel">消す</button>
  </div>
</div>
<div class="toast" id="toast"><span id="toastTxt"></span><button id="toastBtn">元に戻す</button></div>

<script src="parse.js"></script>
<script>
const APP_VERSION = '2026-10-16-1';
const GAS = 'https://script.google.com/macros/s/AKfycbyX-ywN70IMoxiLOF3VyRgje4y85_ilLzhyWfqszCvaEevBNjxtX62tboVMyGvht9VGbw/exec';
const Q = new URLSearchParams(location.search);
const QUICK = Q.get('quick') === '1';
const HS = window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.potto;
const tell = m => { try { HS && HS.postMessage(m); } catch (e) {} };
const $ = id => document.getElementById(id);
const DAY = 86400000;
if (QUICK) document.body.classList.add('quick');

/* ---------- 保存（端末の中）---------- */
const LS = {
  get(k, d) { try { const v = localStorage.getItem('potto.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('potto.' + k, JSON.stringify(v)); } catch (e) {} },
};
// 合言葉は #k=… で1回だけ渡す（コードには書かない）
(function () {
  const m = /[#&]k=([A-Za-z0-9]+)/.exec(location.hash);
  if (m) { LS.set('key', m[1]); history.replaceState(null, '', location.pathname + location.search); }
})();
let KEY = LS.get('key', '');
let items = LS.get('items', {});        // id → item
let pending = LS.get('pending', []);    // まだ棚に届いていない id
let lastS = LS.get('lastS', 0);
const saveLocal = () => { LS.set('items', items); LS.set('pending', pending); LS.set('lastS', lastS); };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

function touch(it) { it.u = Date.now(); items[it.id] = it; if (!pending.includes(it.id)) pending.push(it.id); saveLocal(); render(); schedulePush(); }

/* ---------- 同期 ---------- */
let pushT = null, busy = false, lastOk = 0, lastErr = '';
function setSync(state, txt) { $('syncDot').className = 'dot ' + state; $('syncTxt').textContent = txt || ''; }
function schedulePush(ms) { clearTimeout(pushT); pushT = setTimeout(push, ms == null ? 250 : ms); }
async function push() {
  if (!KEY) return setSync('', '同期なし');
  if (!pending.length) return;
  if (busy) return schedulePush(800);
  busy = true; setSync('busy', '送信中');
  const ids = pending.slice(), sent = ids.map(id => items[id]).filter(Boolean);
  const snap = {}; sent.forEach(it => snap[it.id] = it.u);
  try {
    const r = await fetch(GAS + '?op=put&key=' + KEY, { method: 'POST', body: JSON.stringify({ items: sent }) });   // text/plain のまま（独自ヘッダはGASに届かない）
    const j = await r.json();
    if (!j.ok) throw new Error(j.err || 'ng');
    pending = pending.filter(id => !(id in snap) || (items[id] && items[id].u !== snap[id]));
    (j.kept || []).forEach(it => { items[it.id] = it; });
    saveLocal(); lastOk = Date.now(); setSync('ok', '');
    tell('pushed');
    busy = false;
    if (pending.length) schedulePush(300); else pull();
  } catch (e) { busy = false; lastErr = String(e); setSync('ng', 'あとで送る'); schedulePush(15000); }
}
async function pull() {
  if (!KEY || busy) return;
  try {
    const r = await fetch(GAS + '?op=get&key=' + KEY + '&since=' + lastS + '&t=' + Date.now());
    const j = await r.json();
    if (!j.ok) { setSync('ng', j.err === 'key' ? '合言葉ちがい' : 'エラー'); return; }
    let changed = false;
    j.items.forEach(it => {
      const cur = items[it.id];
      if (pending.includes(it.id) && cur && cur.u > it.u) return;          // こちらで書きかけの方が新しい
      if (!cur || it.u >= cur.u || it.rid !== cur.rid || it.s !== cur.s) { items[it.id] = it; changed = true; }
    });
    lastS = Math.max(lastS, j.now || 0); saveLocal();
    lastOk = Date.now(); if (!pending.length) setSync('ok', '');
    if (changed) render();
  } catch (e) { setSync('ng', 'オフライン'); }
}

/* ---------- 入力 ---------- */
const inp = $('inp');
let override = null, composing = false, compEnd = 0;
inp.addEventListener('compositionstart', () => composing = true);
inp.addEventListener('compositionend', () => { composing = false; compEnd = Date.now(); });
function grow() { inp.style.height = ''; if (inp.value) inp.style.height = Math.min(inp.scrollHeight + 2, 160) + 'px'; }
inp.addEventListener('input', () => { override = null; grow(); preview(); });
inp.addEventListener('keydown', e => {
  if (e.key === 'Escape') { inp.value = ''; preview(); tell('close'); return; }
  if (e.key !== 'Enter' || e.shiftKey) return;
  if (e.isComposing || composing || e.keyCode === 229 || Date.now() - compEnd < 80) return;   // 日本語の確定Enterでは入れない
  e.preventDefault(); add();
});
function readNow() {
  const r = PottoParse.parse(inp.value);
  if (override && override !== r.kind) {
    r.kind = override;
    if (override === 'log' && (!r.at || r.at > Date.now())) r.at = Date.now();
    if (override === 'due' && r.at && r.at <= Date.now()) r.at = null;
  }
  return r;
}
function preview() {
  const v = inp.value.trim(), pv = $('pv');
  if (!v) { pv.innerHTML = '<span class="hint">「〜までに」「来週金曜」→ 期限／「〜した」「〜入った」→ 記録' + (QUICK ? '　Enterで入れる・Escで閉じる' : '') + '</span>'; return; }
  const r = readNow();
  const k = r.kind === 'due'
    ? `<button class="chip k-due" id="flip" title="押すと記録に変える">⏳ 期限</button>`
    : `<button class="chip k-log" id="flip" title="押すと期限に変える">📝 記録</button>`;
  const when = r.kind === 'due' ? (r.at ? fmtDate(r.at, r.hasTime) + ' まで' : 'いつまで？（未定）') : fmtDate(r.at, r.hasTime);
  pv.innerHTML = k + `<span class="chip">${esc(when)}</span><span class="chip">${r.icon || '・'} ${esc(r.title)}</span>` + (r.who ? `<span class="chip who">👤 ${esc(r.who)}</span>` : '') + `<span class="hint">⏎</span>`;
  $('flip').onclick = () => { override = r.kind === 'due' ? 'log' : 'due'; preview(); inp.focus(); };
}
function add() {
  const v = inp.value.trim(); if (!v) return;
  const r = readNow(), now = Date.now();
  const it = Object.assign({ id: uid(), c: now, done: false }, r);
  inp.value = ''; override = null; grow(); preview();
  touch(it);
  showRecent(it);
  toast((it.kind === 'due' ? '⏳ 期限に入れた' : '📝 記録した') + '：' + it.title, () => { it.del = true; touch(it); });
  if (QUICK) { schedulePush(0); tell('added|' + (it.kind === 'due' ? '⏳ ' + (it.at ? fmtDate(it.at, it.hasTime) + ' まで' : '期限未定') : '📝 記録') + '：' + it.title); }
}
function showRecent(it) {
  if (!QUICK) return;
  const list = Object.values(items).filter(x => !x.del).sort((a, b) => b.c - a.c).slice(0, 3);
  $('recent').innerHTML = list.map(x => `<div>${x.kind === 'due' ? '⏳' : '📝'} ${esc(x.title)} <span style="color:var(--faint)">— ${x.kind === 'due' ? (x.at ? fmtDate(x.at, x.hasTime) + 'まで' : '期限未定') : fmtDate(x.at, x.hasTime)}</span></div>`).join('');
}

/* ---------- 表示 ---------- */
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const W = '日月火水木金土';
const d0 = ms => { const d = new Date(ms); d.setHours(0, 0, 0, 0); return d.getTime(); };
const p2 = n => String(n).padStart(2, '0');
function fmtDate(ms, hasTime) {
  if (ms == null) return '';
  const d = new Date(ms), now = new Date();
  let s = `${d.getMonth() + 1}/${d.getDate()}(${W[d.getDay()]})`;
  if (d.getFullYear() !== now.getFullYear()) s = d.getFullYear() + '/' + s;
  if (hasTime) s += ' ' + d.getHours() + ':' + p2(d.getMinutes());
  return s;
}
const calDays = (a, b) => Math.round((d0(b) - d0(a)) / DAY);
function leftTxt(it, now) {   // 期限まで
  const ms = it.at - now, days = calDays(now, it.at);
  if (ms < 0) {
    const ago = -ms;
    return ago < DAY ? Math.max(1, Math.round(ago / 3600000)) + '時間すぎ' : Math.round(ago / DAY) + '日すぎ';
  }
  if (ms < 3600000) return 'あと' + Math.max(1, Math.round(ms / 60000)) + '分';
  if (days === 0) return it.hasTime ? 'あと' + Math.round(ms / 3600000) + '時間' : '今日まで';
  if (days === 1) return '明日まで';
  if (days >= 60) return 'あと' + Math.round(days / 30) + 'か月';
  return 'あと' + days + '日';
}
function agoTxt(ms, now) {
  const days = calDays(ms, now);
  if (days <= 0) return '今日'; if (days === 1) return '昨日';
  if (days >= 365) return (days / 365).toFixed(1).replace('.0', '') + '年前';
  if (days >= 60) return Math.round(days / 30) + 'か月前';
  return days + '日前';
}
const spanTxt = d => d >= 60 ? Math.round(d / 30) + 'か月' : d + '日';

function render() {
  if (QUICK) return;
  const now = Date.now();
  const all = Object.values(items).filter(x => !x.del);
  const dues = all.filter(x => x.kind === 'due' && !x.done && x.at != null).sort((a, b) => a.at - b.at);
  const undated = all.filter(x => x.kind === 'due' && !x.done && x.at == null).sort((a, b) => b.c - a.c);
  // 済んだ期限は「やったこと」として過去側に出す
  const logs = all.filter(x => x.kind === 'log' || x.done).map(x => x.kind === 'log' ? x : Object.assign({}, x, { _done: true, at: x.doneAt || x.u }))
    .sort((a, b) => b.at - a.at);

  // 同じ束（髪 等）の前回との間・平均
  const groups = {};
  logs.slice().reverse().forEach(x => { if (x._done) return; const k = PottoParse.groupKey(x.title); (groups[k] = groups[k] || []).push(x); });

  const t = new Date();
  $('todayLbl').textContent = `今日 ${t.getMonth() + 1}/${t.getDate()}(${W[t.getDay()]})`;

  $('futList').innerHTML = dues.length ? dues.map(x => dueCard(x, now)).join('') : '<div class="empty">期限はまだ無い<br>「日曜までに片付け」と書くとここに並ぶ</div>';
  $('undated').innerHTML = undated.length ? '<div class="sub">いつまで？（期限が決まっていない）</div><div class="list">' + undated.map(x => dueCard(x, now)).join('') + '</div>' : '';
  const LIM = showAll ? 9999 : 40;
  $('pastList').innerHTML = (logs.length ? logs.slice(0, LIM).map(x => logCard(x, now, groups)).join('') : '<div class="empty">記録はまだ無い<br>「髪切った」と書くとここに並ぶ</div>')
    + (logs.length > LIM ? `<button class="more" id="moreBtn">ほか ${logs.length - LIM} 件を見る</button>` : '');
  if ($('moreBtn')) $('moreBtn').onclick = () => { showAll = true; render(); };
  drawStrip(dues, logs, now);
  document.querySelectorAll('[data-id]').forEach(el => el.onclick = e => {
    if (e.target.closest('.ck')) { e.stopPropagation(); markDone(el.dataset.id); return; }
    openSheet(el.dataset.id);
  });
}
let showAll = false;
function dueCard(x, now) {
  let cls = 'card due', big = '期限未定', sm = '', bar = '';
  if (x.at != null) {
    const ms = x.at - now;
    if (ms < 0) cls += ' over'; else if (ms < 2 * DAY) cls += ' soon';
    big = leftTxt(x, now); sm = fmtDate(x.at, x.hasTime) + ' まで';
    const total = Math.max(1, x.at - x.c), used = Math.min(1, Math.max(0, (now - x.c) / total));
    bar = `<div class="bar"><i style="width:${(used * 100).toFixed(1)}%"></i></div>`;
  }
  const meta = [];
  if (x.who) meta.push(`<span class="who">👤 ${esc(x.who)}</span>`);
  if (x.rid && x.rid !== '-') meta.push('<span title="Macのリマインダー「期限」に入っている">🔔 リマインダー</span>');
  { const g = agoTxt(x.c, now); meta.push(`<span>${g}${/今日|昨日/.test(g) ? '' : 'に'}書いた</span>`); }
  return `<div class="${cls}" data-id="${x.id}"><button class="ck" title="済み">✓</button><div class="bd"><div class="tt">${x.icon ? x.icon + ' ' : ''}${esc(x.title)}</div><div class="mt">${meta.join('')}</div>${bar}</div><div class="rt"><div class="big">${big}</div><div class="sm">${sm}</div></div></div>`;
}
function logCard(x, now, groups) {
  const meta = [`<span>${fmtDate(x.at, x.hasTime)}</span>`];
  if (x._done) {
    meta.push('<span style="color:var(--ok)">✓ 期限ぶん済み</span>');
    if (x.at && x.at != null && items[x.id].at) {
      const diff = calDays(x.at, items[x.id].at);
      meta.push(`<span>${diff > 0 ? '期限の' + diff + '日前' : diff === 0 ? '期限の日' : '期限から' + (-diff) + '日おくれ'}</span>`);
    }
  } else {
    const g = groups[PottoParse.groupKey(x.title)] || [];
    const i = g.findIndex(y => y.id === x.id);
    if (i > 0) meta.push(`<span>前回から${spanTxt(calDays(g[i - 1].at, x.at))}</span>`);
    if (i === g.length - 1 && g.length >= 3) {
      const avg = Math.round(calDays(g[0].at, x.at) / (g.length - 1));
      meta.push(`<span>平均${spanTxt(avg)}ごと・${g.length}回目</span>`);
    }
    if (x.who) meta.push(`<span class="who">👤 ${esc(x.who)}</span>`);
  }
  return `<div class="card log ${x._done ? 'done' : ''}" data-id="${x.id}"><div class="ic">${x._done ? '✓' : (x.icon || '・')}</div><div class="bd"><div class="tt">${esc(x.title)}</div><div class="mt">${meta.join('')}</div></div><div class="rt"><div class="big">${agoTxt(x.at, now)}</div></div></div>`;
}

/* 帯：今日を真ん中に、左＝過去の記録、右＝未来の期限。近いほど広く（平方根の目盛り） */
function drawStrip(dues, logs, now) {
  const el = $('strip');
  const narrow = innerWidth < 760;
  const Wd = narrow ? 360 : 1060, H = narrow ? 176 : 160, cx = Wd / 2, half = Wd / 2 - 14, axis = narrow ? 100 : H / 2 + 6;
  const far = Math.max(30, ...dues.map(x => calDays(now, x.at)).filter(d => d > 0).map(d => Math.min(d, 365)), ...logs.slice(0, 30).map(x => Math.min(365, calDays(x.at, now))));
  const R = Math.min(365, Math.ceil(far / 30) * 30 || 30);
  const X = d => cx + Math.sign(d) * Math.sqrt(Math.min(Math.abs(d), R) / R) * half;
  let s = `<svg viewBox="0 0 ${Wd} ${H}" xmlns="http://www.w3.org/2000/svg">`;
  s += `<line x1="8" y1="${axis}" x2="${Wd - 8}" y2="${axis}" style="stroke:var(--line);stroke-width:2"/>`;
  [7, 30, 90, 180, 365].filter(d => d <= R).forEach(d => {
    [-d, d].forEach(v => {
      const x = X(v);
      s += `<line x1="${x}" y1="${axis - 4}" x2="${x}" y2="${axis + 4}" style="stroke:var(--faint)"/>`;
      s += `<text x="${x}" y="${H - 4}" text-anchor="middle" style="fill:var(--faint);font-size:10px">${d === 7 ? '1週' : d === 30 ? '1か月' : d === 90 ? '3か月' : d === 180 ? '半年' : '1年'}${v < 0 ? '前' : '後'}</text>`;
    });
  });
  s += `<line x1="${cx}" y1="10" x2="${cx}" y2="${H - 16}" style="stroke:var(--accent);stroke-width:2"/>`;
  s += `<text x="${cx}" y="10" text-anchor="middle" style="fill:var(--accent);font-weight:700">今日</text>`;
  // ラベルが重ならないように段をずらす
  const place = (arr, up, color) => {
    const rows = [];
    arr.forEach(o => {
      const x = o.x, w = Math.min(130, 14 + o.label.length * 11);
      let r = 0; while (rows[r] && rows[r].some(([a, b]) => !(x + w / 2 < a || x - w / 2 > b))) r++;
      if (r > 2) { s += `<circle cx="${x}" cy="${axis}" r="3.5" style="fill:${color}"/>`; return; }
      (rows[r] = rows[r] || []).push([x - w / 2, x + w / 2]);
      const y = up ? axis - 16 - r * 17 : axis + 20 + r * 17;
      s += `<line x1="${x}" y1="${axis}" x2="${x}" y2="${up ? y + 3 : y - 11}" style="stroke:${color};stroke-opacity:.5"/>`;
      s += `<circle cx="${x}" cy="${axis}" r="4.5" style="fill:${color}"/>`;
      s += `<text x="${x}" y="${y}" text-anchor="middle" style="fill:${color}">${esc(o.label)}</text>`;
    });
  };
  const trunc = (t, n) => t.length > n ? t.slice(0, n) + '…' : t;
  const n = narrow ? 5 : 9;
  place(dues.slice(0, 14).map(x => ({ x: X(calDays(now, x.at) + (x.at < now ? -0.01 : 0)), label: (x.icon || '') + trunc(x.title, n) })), true, 'var(--due)');
  place(logs.slice(0, 14).map(x => ({ x: X(-calDays(x.at, now)), label: (x._done ? '✓' : (x.icon || '')) + trunc(x.title, n) })), false, 'var(--log)');
  s += '</svg>';
  el.innerHTML = s;
}

/* ---------- 直す ---------- */
let editId = null, editSnap = null;
function openSheet(id) {
  const x = items[id]; if (!x) return;
  editId = id; editSnap = JSON.stringify(x);
  $('eTitle').value = x.title; $('eWho').value = x.who || ''; $('eRaw').textContent = x.raw && x.raw !== x.title ? '元の文：' + x.raw : '';
  if (x.at != null) { const d = new Date(x.at); $('eDate').value = `${d.getFullYear()}-${p2(d.getMonth() + 1)}-${p2(d.getDate())}`; $('eTime').value = x.hasTime ? `${p2(d.getHours())}:${p2(d.getMinutes())}` : ''; }
  else { $('eDate').value = ''; $('eTime').value = ''; }
  segK(x.kind);
  $('eDone').textContent = x.done ? '済みを取り消す' : '✓ 済みにする';
  $('eDone').style.display = x.kind === 'due' ? '' : 'none';
  $('sheet').classList.add('on'); $('sheetBg').classList.add('on');
}
function segK(k) { document.querySelectorAll('#kSeg button').forEach(b => b.classList.toggle('on', b.dataset.k === k)); $('eDateLbl').textContent = k === 'due' ? 'いつまで' : 'いつ（やった日）'; }
document.querySelectorAll('#kSeg button').forEach(b => b.onclick = () => { segK(b.dataset.k); $('eDone').style.display = b.dataset.k === 'due' ? '' : 'none'; });
function readSheet() {
  const x = Object.assign({}, items[editId]);
  x.kind = document.querySelector('#kSeg button.on').dataset.k;
  x.title = $('eTitle').value.trim() || x.title; x.who = $('eWho').value.trim();
  x.icon = PottoParse.iconFor(x.title + ' ' + (x.raw || '')) || x.icon;
  const dv = $('eDate').value, tv = $('eTime').value;
  if (dv) {
    const [y, m, d] = dv.split('-').map(Number), dt = new Date(y, m - 1, d);
    if (tv) { const [h, mi] = tv.split(':').map(Number); dt.setHours(h, mi, 0, 0); x.hasTime = true; }
    else { dt.setHours(x.kind === 'due' ? PottoParse.DUE_DEFAULT_HOUR : 12, 0, 0, 0); x.hasTime = false; }
    x.at = dt.getTime();
  } else x.at = x.kind === 'due' ? null : (x.at || Date.now());
  return x;
}
function closeSheet(save) {
  if (save && editId && items[editId]) {
    const x = readSheet(), before = JSON.parse(editSnap);
    const same = ['kind', 'title', 'who', 'at', 'hasTime', 'icon'].every(k => before[k] === x[k]);
    if (!same) touch(x);
  }
  editId = null; $('sheet').classList.remove('on'); $('sheetBg').classList.remove('on');
}
$('eSave').onclick = () => closeSheet(true);
$('sheetBg').onclick = () => closeSheet(true);
$('eDone').onclick = () => { const x = readSheet(); x.done = !x.done; x.doneAt = x.done ? Date.now() : null; editId = null; touch(x); closeSheet(false); };
$('eDel').onclick = () => { const x = Object.assign({}, items[editId]); closeSheet(false); x.del = true; touch(x); toast('消した：' + x.title, () => { x.del = false; touch(x); }); };
function markDone(id) {
  const x = Object.assign({}, items[id]); x.done = true; x.doneAt = Date.now(); touch(x);
  toast('✓ 済み：' + x.title, () => { const y = Object.assign({}, items[id]); y.done = false; y.doneAt = null; touch(y); });
}

let toastT = null;
function toast(txt, undo) {
  $('toastTxt').textContent = txt; $('toast').classList.add('on');
  $('toastBtn').style.display = undo ? '' : 'none';
  $('toastBtn').onclick = () => { undo && undo(); $('toast').classList.remove('on'); };
  clearTimeout(toastT); toastT = setTimeout(() => $('toast').classList.remove('on'), 5000);
}

/* ---------- 起動 ---------- */
function keyNote() {
  $('keyNote').innerHTML = KEY ? '' : '<div class="keybox">同期の合言葉がまだ入っていません（この端末の中だけに保存中）。最初にもらったリンクから1回開くと、iPhoneとMacがつながります。</div>';
}
keyNote(); preview(); render(); grow();
pull(); if (pending.length) schedulePush(500);
setInterval(pull, 30000);
setInterval(() => { if (!QUICK) render(); }, 60000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { pull(); checkVersion(); render(); } });
addEventListener('focus', () => pull());
addEventListener('resize', () => { clearTimeout(window._rz); window._rz = setTimeout(render, 150); });
// Macの入力窓から：開いた瞬間に呼ばれる
$('openAll').onclick = () => tell('open');
window.pottoFocus = () => { inp.focus(); pull(); showRecent(); };
if (!('ontouchstart' in window)) inp.focus();
$('foot').textContent = 'v' + APP_VERSION;

let checking = false;
async function checkVersion() {
  if (checking || !navigator.onLine) return; checking = true;
  try {
    const r = await fetch('version.txt?t=' + Date.now(), { cache: 'no-store' });
    if (r.ok) {
      const latest = (await r.text()).trim();
      if (latest && latest !== APP_VERSION && sessionStorage.getItem('reloaded_for') !== latest) { sessionStorage.setItem('reloaded_for', latest); location.reload(); }
    }
  } catch (e) {} finally { checking = false; }
}
checkVersion();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
